version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go -C examples get -u ./...
      - go -C examples get -u tool
      - go mod tidy
      - go -C examples mod tidy

  generate-cldr:
    desc: 'Regenerate emoji metadata offline from the pinned CLDR snapshot'
    cmds:
      - go generate ./...

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test ./...
      - go -C examples test ./...

  test-font-demo:
    desc: 'Check browser font selection and load fallback (requires Node.js 22+)'
    cmds:
      - node --test scripts/font-demo.test.mjs

  fmt-check:
    desc: 'Check Go formatting without modifying files'
    cmds:
      - sh scripts/check-format.sh

  ci:
    desc: 'Check formatting, race tests, vet, native builds, and WASM demos'
    cmds:
      - task: fmt-check
      - go test -race ./...
      - go -C examples test -race ./...
      - go vet ./...
      - go -C examples vet ./...
      - go build ./cmd/...
      - go -C examples build ./...
      - sh scripts/build-wasm-site.sh

  build:
    desc: 'Build all the things'
    deps:
      - build-examples
      - build-cli

  clean:
    desc: 'Clean native binaries and task checksums'
    cmds:
      - rm -rf bin/
      - rm -rf .task

  build-examples:
    desc: 'Build all examples'
    deps:
      - build-ex-swatch
      - build-ex-simple

  build-ex-swatch:
    desc: 'Build the swatch example'
    cmds:
      - mkdir -p bin
      - go -C examples build -o ../bin/ntemoji-swatch ./swatch
    sources:
      - "*.go"
      - examples/swatch/*.go
      - examples/internal/demorun/*.go
      - examples/go.mod
      - examples/go.sum
      - go.mod
      - go.sum
      - Taskfile.yml
    generates:
      - bin/ntemoji-swatch

  build-ex-simple:
    desc: 'Build the simple example'
    cmds:
      - mkdir -p bin
      - go -C examples build -o ../bin/ntemoji-simple ./simple
    sources:
      - "*.go"
      - examples/simple/*.go
      - examples/internal/demorun/*.go
      - examples/go.mod
      - examples/go.sum
      - go.mod
      - go.sum
      - Taskfile.yml
    generates:
      - bin/ntemoji-simple

  build-cli:
    desc: 'Build Demoji and Remoji CLI tools'
    cmds:
      - mkdir -p bin
      - go build -o bin/demoji ./cmd/demoji
      - go build -o bin/remoji ./cmd/remoji
    sources:
      - "*.go"
      - cmd/demoji/*.go
      - cmd/remoji/*.go
      - internal/textcli/*.go
      - go.mod
      - go.sum
      - Taskfile.yml
    generates:
      - bin/demoji
      - bin/remoji

  build-wasm-site:
    desc: 'Build the WASM demo site into web/'
    cmds:
      - sh scripts/build-wasm-site.sh
    sources:
      - "*.go"
      - examples/simple/*.go
      - examples/swatch/*.go
      - cmd/emojiwasm/*.go
      - examples/internal/demorun/*.go
      - examples/cmd/demo-assets/*.go
      - examples/go.mod
      - examples/go.sum
      - go.mod
      - go.sum
      - wasm.work
      - wasm.work.sum
      - Taskfile.yml
      - scripts/build-wasm-site.sh
      - site/*
      - third_party/unicode/*
    generates:
      - web/demos/simple.wasm
      - web/demos/swatch.wasm
      - web/demos/convert.wasm
      - web/index.html
      - web/style.css
      - web/demo.js
      - web/converter.js
      - web/convert-worker.js
      - web/font-demo.js
      - web/fonts/NotoColorEmoji.ttf
      - web/fonts/NotoColorEmoji-sbix.ttf
      - web/fonts/specimens.json
      - web/fonts/OFL.txt
      - web/fonts/OFL-sbix.txt
      - web/fonts/NOTICE.txt
      - web/wasm_exec.js
      - web/booba/booba.js
      - web/ntwebterm/ntwebterm.js
      - web/ntwebterm/ghostty-vt.wasm
      - web/third_party/unicode/LICENSE.txt
      - web/third_party/unicode/NOTICE.txt

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntemoji/ (matches GH Pages prefix)'
    deps: [build-wasm-site]
    vars:
      SERVE_DIR: /tmp/ntemoji-site
    cmds:
      - mkdir -p {{.SERVE_DIR}}
      - rm -f {{.SERVE_DIR}}/ntemoji
      - ln -sfn "$(pwd)/web" {{.SERVE_DIR}}/ntemoji
      - echo 'Serving at http://localhost:8000/ntemoji/'
      - cd {{.SERVE_DIR}} && python3 -m http.server 8000

  clean-wasm-site:
    desc: 'Remove WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ntwebterm web/fonts web/ghostty-web web/_assets web/demos web/third_party
      - rm -f web/wasm_exec.js web/app.wasm web/index.html web/style.css web/demo.js web/converter.js web/convert-worker.js web/font-demo.js

  release:
    desc: 'Package a snapshot release into dist with GoReleaser, publishing nothing'
    cmds:
      - goreleaser release --snapshot --clean

  release-check:
    desc: 'Check the GoReleaser configuration'
    cmds:
      - goreleaser check
