name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.8', '1.27.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.54.0'
      - name: Run CI checks
        run: task ci
